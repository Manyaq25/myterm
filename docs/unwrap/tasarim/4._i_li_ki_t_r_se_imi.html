<script>
  (function () {
    const pills = document.querySelectorAll('#relationship-options .option-pill');
    pills.forEach((pill) => {
      pill.addEventListener('click', () => {
        pills.forEach((p) => {
          p.classList.remove('is-selected', 'bg-secondary-fixed', 'text-on-secondary-fixed', 'shadow-md');
          p.classList.add('bg-surface-container', 'text-on-surface', 'shadow-sm');
          const title = p.querySelector('span.font-label-lg');
          if (title) {
            title.classList.remove('text-on-secondary-fixed', 'font-extrabold');
            title.classList.add('text-on-surface');
          }
          const icon = p.querySelector('.check-icon');
          if (icon) {
            icon.classList.add('hidden');
          }
        });

        pill.classList.remove('bg-surface-container', 'text-on-surface', 'shadow-sm');
        pill.classList.add('is-selected', 'bg-secondary-fixed', 'text-on-secondary-fixed', 'shadow-md');
        const activeTitle = pill.querySelector('span.font-label-lg');
        if (activeTitle) {
          activeTitle.classList.remove('text-on-surface');
          activeTitle.classList.add('text-on-secondary-fixed', 'font-extrabold');
        }
        const activeIcon = pill.querySelector('.check-icon');
        if (activeIcon) {
          activeIcon.classList.remove('hidden');
        }
      });
    });
  })();
