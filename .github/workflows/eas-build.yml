name: EAS Build (standalone install link)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - ios
      profile:
        description: "Build profile (see eas.json)"
        required: false
        default: "preview"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform "${{ github.event.inputs.platform }}" --profile "${{ github.event.inputs.profile }}" --non-interactive --no-wait=false
