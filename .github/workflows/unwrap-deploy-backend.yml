# Unwrap sunucusunu AYRI bir Vercel projesine (unwrap-backend) yayınlar.
# Synvia'nın sunucusuna (backend/) dokunmaz.
name: Unwrap sunucu yayını (Vercel)

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["unwrap/backend/**", ".github/workflows/unwrap-deploy-backend.yml"]

# Aynı anda iki yayın çakışmasın (sağlık kontrolü yarım geçişte hata görüyordu).
concurrency:
  group: unwrap-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unwrap/backend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npx tsc --noEmit && npm test
      - run: npm install --global vercel@latest
      - name: Vercel projesine bağlan
        run: vercel link --yes --project unwrap-backend --token "$VERCEL_TOKEN"
      - name: Ortam değişkenleri
        run: |
          set_env() {
            if [ -z "$2" ]; then echo "EKSİK (GitHub sırrı boş ya da adı farklı): $1"; return 0; fi
            vercel env rm "$1" production --yes --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$2" | vercel env add "$1" production --token "$VERCEL_TOKEN" >/dev/null
            echo "ayarlandı: $1"
          }
          set_env UNWRAP_ANTHROPIC_API_KEY "${{ secrets.UNWRAP_ANTHROPIC_API_KEY }}"
          set_env REVENUECAT_SECRET_KEY "${{ secrets.UNWRAP_REVENUECAT_SECRET_KEY }}"
          set_env PLAY_INTEGRITY_SA_JSON '${{ secrets.UNWRAP_PLAY_INTEGRITY_SA_JSON }}'
          set_env UPSTASH_REDIS_REST_URL "${{ secrets.UNWRAP_UPSTASH_REDIS_REST_URL || secrets.UPSTASH_REDIS_REST_URL }}"
          set_env UPSTASH_REDIS_REST_TOKEN "${{ secrets.UNWRAP_UPSTASH_REDIS_REST_TOKEN }}"
          set_env INTEGRITY_MODE "${{ vars.UNWRAP_INTEGRITY_MODE || 'log' }}"
      # Derleme Vercel'de yapılır: "Secret" türündeki değişkenler indirilemediği için
      # yerelde derleme (--prebuilt) yer tutucu değerlerle çalışırdı.
      - name: Yerel kalıntıları temizle
        run: rm -f .env.local .vercel/.env.production.local
      - name: Yayınla
        id: deploy
        run: |
          vercel deploy --prod --token "$VERCEL_TOKEN" 2>&1 | tee out.log
          url=$(grep -A1 'Aliased' out.log | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1)
          url=${url:-$(grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' out.log | tail -n 1)}
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Sağlık kontrolü
        run: |
          curl -sS --max-time 20 "${{ steps.deploy.outputs.url }}/api/health" | tee h.json
          grep -q '"service":"unwrap"' h.json
          # Güvenlik yaması (Ekim 2026, Brotli RCE): Node 22.23.4 ve üstü bekleniyor.
          node -e 'const v=require("./h.json").node.slice(1).split(".").map(Number);const ok=v[0]>22||(v[0]===22&&(v[1]>23||(v[1]===23&&v[2]>=4)));console.log("Sunucu Node:",v.join("."),ok?"(yamalı)":"(YAMASIZ: Vercel henüz güncellememiş)");if(!ok)console.log("::warning::Vercel Node sürümü yamasız");'
          # Abonelik olmadan ücretli uç kapalı olmalı
          code=$(curl -s -o r.json -w '%{http_code}' -X POST "${{ steps.deploy.outputs.url }}/api/report" -H 'x-app-user-id: ci-test' -d '{}')
          echo "abonesiz rapor: HTTP $code"; head -c 300 r.json; echo
          [ "$code" = "402" ] || { sleep 30; timeout 40 vercel logs --since 10m --deployment "$(grep -Eo "https://unwrap-backend-[a-z0-9]+-[a-z0-9]+\.vercel\.app" out.log | tail -n 1)" --token "$VERCEL_TOKEN" 2>&1 | tail -40 || true; exit 1; }
          # Veritabanı bağlantısı (sayaç Upstash'tan okunur)
          code=$(curl -s -o c.json -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/counter"); cat c.json; echo
          echo "sayaç: HTTP $code"; [ "$code" = "200" ]
          # Hesap: boş gövde reddedilmeli, profil kimliksiz kapalı olmalı
          code=$(curl -s -o a.json -w '%{http_code}' -X POST "${{ steps.deploy.outputs.url }}/api/hesap" -d ''); cat a.json; echo
          echo "boş giriş: HTTP $code"; [ "$code" = "400" ]
          code=$(curl -s -o p.json -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/profil"); cat p.json; echo
          echo "kimliksiz profil: HTTP $code"; [ "$code" = "401" ]
          echo "Unwrap sunucusu: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
