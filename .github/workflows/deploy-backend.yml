name: Deploy Backend (Vercel)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Set Vercel environment variables
        run: |
          set_env() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            # Earlier failed runs can leave duplicate entries for the same
            # name/target behind (each "already exists" failure still left
            # the previous value in place), so a single rm+retry isn't
            # always enough. Loop: try to add, and on "already exists" remove
            # one entry and retry, up to a bounded number of attempts.
            attempt=0
            max_attempts=5
            while [ $attempt -lt $max_attempts ]; do
              attempt=$((attempt + 1))
              add_output=$(printf '%s' "$value" | vercel env add "$name" production --token "${{ secrets.VERCEL_TOKEN }}" 2>&1) && add_status=0 || add_status=$?
              echo "$add_output"
              if [ $add_status -eq 0 ]; then
                return 0
              fi
              if echo "$add_output" | grep -qi "already exists"; then
                vercel env rm "$name" production --yes --token "${{ secrets.VERCEL_TOKEN }}" || true
                continue
              fi
              echo "Failed to set $name" >&2
              exit 1
            done
            echo "Failed to set $name after $max_attempts attempts" >&2
            exit 1
          }
          set_env ANTHROPIC_API_KEY "${{ secrets.ANTHROPIC_API_KEY }}"
          set_env OPENAI_API_KEY "${{ secrets.OPENAI_API_KEY }}"
          set_env APP_SHARED_SECRET "${{ secrets.APP_SHARED_SECRET }}"
          set_env ANTHROPIC_MODEL "${{ vars.ANTHROPIC_MODEL }}"
          set_env OPENAI_TRANSCRIBE_MODEL "${{ vars.OPENAI_TRANSCRIBE_MODEL }}"

      - name: Build
        run: vercel build --prod --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          set -e
          vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee deploy_output.log
          deployment_url=$(tail -n 20 deploy_output.log | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1)
          # Prefer the stable "Aliased" production domain (persists across deploys)
          # over the per-deployment URL (changes every deploy).
          alias_url=$(grep -A1 'Aliased' deploy_output.log | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1)
          url="${alias_url:-$deployment_url}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      - name: Smoke test /api/extract
        run: |
          set -e
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 20 \
            "${{ steps.deploy.outputs.url }}/api/extract" \
            -H "Content-Type: application/json" \
            -d '{"text":"Ahmete yarin teklifi gonderecegim, ondan da gecen haftaki raporu bekliyorum."}')
          echo "HTTP $status"
          cat response.json
          if [ "$status" != "200" ]; then
            echo "Smoke test failed"
            exit 1
          fi
          count=$(python3 -c "import json;print(len(json.load(open('response.json'))['candidates']))")
          echo "candidate count: $count"
          if [ "$count" -lt 2 ]; then
            echo "Smoke test failed: compound-sentence text should split into >= 2 candidates, got $count"
            exit 1
          fi

      - name: Smoke test /api/extract — waiting_on vs task classification
        run: |
          set -e
          status=$(curl -sS -o response_type.json -w "%{http_code}" --max-time 20 \
            "${{ steps.deploy.outputs.url }}/api/extract" \
            -H "Content-Type: application/json" \
            -d '{"text":"Ali gazete getirecek."}')
          echo "HTTP $status"
          cat response_type.json
          if [ "$status" != "200" ]; then
            echo "Smoke test failed"
            exit 1
          fi
          type=$(python3 -c "import json;print(json.load(open('response_type.json'))['candidates'][0]['type'])")
          echo "type: $type"
          if [ "$type" != "waiting_on" ]; then
            echo "Smoke test failed: a sentence whose subject is someone else should classify as waiting_on, got $type"
            exit 1
          fi

      - name: Smoke test /api/extract-image
        run: |
          set -e
          pip install --quiet --user pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import base64, json
          img = Image.new("RGB", (760, 120), color="white")
          d = ImageDraw.Draw(img)
          d.text((10, 40), "Ahmete yarin teklifi gonderecegim, ondan da gecen haftaki raporu bekliyorum.", fill="black")
          img.save("test-image.png")
          with open("test-image.png", "rb") as f:
              b64 = base64.b64encode(f.read()).decode()
          with open("image_payload.json", "w") as f:
              json.dump({"imageBase64": b64, "mediaType": "image/png"}, f)
          PY
          status=$(curl -sS -o response_image.json -w "%{http_code}" --max-time 30 \
            "${{ steps.deploy.outputs.url }}/api/extract-image" \
            -H "Content-Type: application/json" \
            --data @image_payload.json)
          echo "HTTP $status"
          cat response_image.json
          if [ "$status" != "200" ]; then
            echo "Smoke test failed"
            exit 1
          fi
          count=$(python3 -c "import json;print(len(json.load(open('response_image.json'))['candidates']))")
          echo "candidate count: $count"
          if [ "$count" -lt 1 ]; then
            echo "Smoke test failed: image extraction should find at least 1 candidate, got $count"
            exit 1
          fi

      - name: Print deployment URL in job summary
        run: echo "Backend deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
