name: Deploy Backend (Vercel)

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Link Vercel project
        run: vercel link --yes --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Set Vercel environment variables
        run: |
          set_env() {
            name="$1"
            value="$2"
            if [ -z "$value" ]; then
              return 0
            fi
            # Add first (cheap path, no-op rm avoided). If it already exists,
            # remove the stale value and retry once. `vercel env rm` and
            # `env add` are not always immediately consistent with each
            # other, so removing unconditionally up front can race and leave
            # the add failing with "already exists" — retrying after a
            # failed add is more reliable than rm-then-add.
            add_output=$(printf '%s' "$value" | vercel env add "$name" production --token "${{ secrets.VERCEL_TOKEN }}" 2>&1)
            add_status=$?
            echo "$add_output"
            if [ $add_status -ne 0 ]; then
              if echo "$add_output" | grep -qi "already exists"; then
                vercel env rm "$name" production --yes --token "${{ secrets.VERCEL_TOKEN }}"
                printf '%s' "$value" | vercel env add "$name" production --token "${{ secrets.VERCEL_TOKEN }}"
              else
                echo "Failed to set $name" >&2
                exit 1
              fi
            fi
          }
          set_env ANTHROPIC_API_KEY "${{ secrets.ANTHROPIC_API_KEY }}"
          set_env APP_SHARED_SECRET "${{ secrets.APP_SHARED_SECRET }}"
          set_env ANTHROPIC_MODEL "${{ vars.ANTHROPIC_MODEL }}"

      - name: Build
        run: vercel build --prod --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        id: deploy
        run: |
          set -e
          vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee deploy_output.log
          deployment_url=$(tail -n 20 deploy_output.log | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1)
          # Prefer the stable "Aliased" production domain (persists across deploys)
          # over the per-deployment URL (changes every deploy).
          alias_url=$(grep -A1 'Aliased' deploy_output.log | grep -Eo 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1)
          url="${alias_url:-$deployment_url}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      - name: Smoke test /api/extract
        run: |
          set -e
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 20 \
            "${{ steps.deploy.outputs.url }}/api/extract" \
            -H "Content-Type: application/json" \
            -d '{"text":"Ahmete yarin teklifi gonderecegim, ondan da gecen haftaki raporu bekliyorum."}')
          echo "HTTP $status"
          cat response.json
          if [ "$status" != "200" ]; then
            echo "Smoke test failed"
            exit 1
          fi
          count=$(python3 -c "import json;print(len(json.load(open('response.json'))['candidates']))")
          echo "candidate count: $count"
          if [ "$count" -lt 2 ]; then
            echo "Smoke test failed: compound-sentence text should split into >= 2 candidates, got $count"
            exit 1
          fi

      - name: Print deployment URL in job summary
        run: echo "Backend deployed to ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
