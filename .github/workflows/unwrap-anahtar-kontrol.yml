# Unwrap'in Anthropic anahtarını değerini göstermeden doğrular (ücretsiz model listesi isteği).
# Elle ya da unwrap/backend/anahtar-kontrol.txt değişince çalışır.
name: Unwrap anahtar kontrolü

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["unwrap/backend/anahtar-kontrol.txt"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Anthropic anahtarı
        env:
          KEY: ${{ secrets.UNWRAP_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "SONUÇ: UNWRAP_ANTHROPIC_API_KEY bulunamadı"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.anthropic.com/v1/models \
            -H "x-api-key: $KEY" -H "anthropic-version: 2023-06-01")
          echo "SONUÇ: HTTP $code"
          [ "$code" = "200" ]
      - name: RevenueCat anahtarı
        env:
          KEY: ${{ secrets.UNWRAP_REVENUECAT_SECRET_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "SONUÇ: UNWRAP_REVENUECAT_SECRET_KEY bulunamadı"; exit 1; fi
          case "$KEY" in sk_*) echo "biçim: gizli anahtar (sk_)";; *) echo "UYARI: anahtar sk_ ile başlamıyor";; esac
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.revenuecat.com/v1/subscribers/unwrap-anahtar-kontrol \
            -H "Authorization: Bearer $KEY")
          echo "SONUÇ: HTTP $code"
          # 201: ilk sorguda deneme kaydı oluşturuldu; anahtar geçerli
          [ "$code" = "200" ] || [ "$code" = "201" ]
      - name: Upstash veritabanı
        env:
          URL: ${{ secrets.UNWRAP_UPSTASH_REDIS_REST_URL || secrets.UPSTASH_REDIS_REST_URL }}
          TOKEN: ${{ secrets.UNWRAP_UPSTASH_REDIS_REST_TOKEN }}
        run: |
          [ -z "$URL" ] && { echo "SONUÇ: adres yok"; exit 1; }
          [ -z "$TOKEN" ] && { echo "SONUÇ: token yok"; exit 1; }
          case "$URL" in https://*.upstash.io*) echo "adres biçimi doğru";; *) echo "UYARI: adres https://...upstash.io biçiminde değil";; esac
          echo "token uzunluğu: ${#TOKEN}"
          [ "$TOKEN" != "$(printf '%s' "$TOKEN" | tr -d '[:space:]')" ] && echo "UYARI: token içinde boşluk/satır sonu var"
          code=$(curl -s -o r.txt -w '%{http_code}' "${URL%/}/ping" -H "Authorization: Bearer $TOKEN")
          echo "SONUÇ: HTTP $code"; cat r.txt; echo
          [ "$code" = "200" ]
