# Unwrap: derleme gerektirmeyen (yalnız ekran/metin) değişiklikleri telefonlara
# EAS Update ile gönderir; derleme kotası harcanmaz. Mağaza yayını değildir.
# Tetikleme: elle ya da unwrap/guncelle.txt değişince.
name: Unwrap güncelleme (EAS Update)

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", main]
    paths: ["unwrap/guncelle.txt"]

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unwrap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --channel production --environment production --platform ios --message "$(git log -1 --pretty=%s)" --non-interactive
