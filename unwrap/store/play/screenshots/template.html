// Floating sticker positions (canvas px): left edge and right edge of phone
const FLOAT_POS = [{ left: 44, top: 572 }, { right: 40, top: 586 }];

function render() {

  const floats = (s.floats || []).map(([t, b, r], i) => {

// Headline auto-fit: shrink until every line fits and it is at most 2 lines
async function fit() {
  await document.fonts.ready;
  const el = document.getElementById('hl');
  const max = el.parentElement.clientWidth;
  let size = 104;
  const test = document.createElement('span');
  test.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-weight:800;letter-spacing:-3.5px;font-family:PJS';
  document.body.appendChild(test);
  const lines = el.textContent.split('\n');
  const widest = () => Math.max(...lines.map((l) => { test.textContent = l; test.style.fontSize = size + 'px'; return test.getBoundingClientRect().width; }));
  while (widest() > max && size > 60) size -= 2;
  el.style.fontSize = size + 'px';
  test.remove();
  document.body.dataset.ready = '1';
}
