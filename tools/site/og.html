<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<!-- WhatsApp/iMessage link önizleme görseli (1200x630). Üretmek için: node tools/site/render.js -->
<style>
  @font-face { font-family: 'Jakarta'; font-weight: 200 800; src: url(../../web/assets/fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: 'Jakarta'; font-weight: 200 800; src: url(../../web/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: 'Mono'; font-weight: 100 800; src: url(../../web/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format('woff2'); }
  html, body { margin: 0; }
  .card {
    width: 1200px; height: 630px; position: relative; overflow: hidden;
    background: #0a1513; color: #d9e5e1; font-family: 'Jakarta', sans-serif;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(110px); }
  .g1 { width: 520px; height: 520px; left: -160px; top: -200px; background: rgba(121, 248, 227, .22); }
  .g2 { width: 460px; height: 460px; right: 60px; bottom: -260px; background: rgba(255, 107, 74, .20); }
  .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.08); }
  .name { font-size: 64px; font-weight: 800; letter-spacing: -0.04em; color: #fff; line-height: 1; }
  .free { margin-top: 10px; font-family: 'Mono', monospace; font-size: 18px; font-weight: 600; color: #79f8e3; letter-spacing: .04em; }
  h1 { margin: 0; font-size: 50px; line-height: 1.12; font-weight: 800; letter-spacing: -0.035em; color: #fff; }
  h1 span { background: linear-gradient(90deg, #79f8e3, #59dbc7 45%, #ffb4a3); -webkit-background-clip: text; color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { padding: 9px 16px; border-radius: 999px; background: rgba(255,255,255,.07); box-shadow: inset 0 1px 1px rgba(255,255,255,.1); font-size: 20px; font-weight: 600; color: #d9e5e1; white-space: nowrap; }
  .site { position: absolute; left: 72px; bottom: 34px; font-family: 'Mono', monospace; font-size: 18px; color: #869490; }
  .site b { color: #d9e5e1; font-weight: 600; }
  .phone {
    position: absolute; right: 70px; top: 54px; width: 330px; height: 714px; border-radius: 52px; padding: 11px;
    background: linear-gradient(180deg, #303b39, #172220); box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.08);
    transform: rotate(4deg);
  }
  .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #f4f7f6; }
  .screen img { width: 100%; display: block; }
</style></head>
<body>
<div class="card">
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="left">
    <div class="brand">
      <img src="../../web/apps/synvia-ai/icon.png" alt="">
      <div><div class="name">Synvia AI</div><div class="free">APP STORE'DA ÜCRETSİZ</div></div>
    </div>
    <h1>Her zaman, <span>her şeyi hatırla.</span></h1>
    <div class="chips">
      <span class="chip">🎤 Sesle ekle</span>
      <span class="chip">📷 Ekran görüntüsü</span>
      <span class="chip">📄 PDF</span>
      <span class="chip">💬 Mesajla hatırlat</span>
    </div>
  </div>
  <div class="site"><b>aydinapp.com.tr</b></div>
  <div class="phone"><div class="screen"><img src="../../web/assets/promo/01-home-geciken.png" alt=""></div></div>
</div>
</body></html>
