<!DOCTYPE html><html class="dark" lang="{{lang}}"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport">
<!-- Bu dosya tools/site/changelog.template.html şablonundan üretilir; doğrudan düzenleme. -->
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://aydinapp.com.tr{{path}}">
<link rel="alternate" hreflang="tr" href="https://aydinapp.com.tr/synvia/yenilikler/">
<link rel="alternate" hreflang="en" href="https://aydinapp.com.tr/en/synvia/whats-new/">
<link rel="alternate" hreflang="x-default" href="https://aydinapp.com.tr/en/synvia/whats-new/">
<meta name="theme-color" content="#0a1513">
<meta name="apple-itunes-app" content="app-id=6812456837">
<meta property="og:type" content="website">
<meta property="og:site_name" content="aydinapp">
<meta property="og:locale" content="{{locale}}">
<meta property="og:url" content="https://aydinapp.com.tr{{path}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:image" content="https://aydinapp.com.tr/{{ogImage}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ogTitle}}">
<meta name="twitter:card" content="summary_large_image">
<link href="/favicon.svg" rel="icon" type="image/svg+xml">
<link href="/apple-touch-icon.png" rel="apple-touch-icon">
<link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<div class="pointer-events-none fixed -top-40 -left-40 w-96 h-96 rounded-full bg-primary opacity-15 blur-[120px] z-0"></div>
<div class="pointer-events-none fixed top-1/3 -right-40 w-96 h-96 rounded-full bg-secondary opacity-10 blur-[140px] z-0"></div>

{{partial:synvia-header}}

<main class="relative z-10 w-full pt-24 overflow-x-clip">
<section class="max-w-3xl mx-auto px-margin md:px-margin-md pt-space-xl pb-space-lg flex flex-col items-center text-center gap-space-md">
<span class="font-label-caps text-label-caps text-secondary uppercase">{{kicker}}</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface tracking-tight">{{pageHeading}}</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant font-light max-w-xl">{{intro}}</p>
</section>

<section class="max-w-3xl mx-auto px-margin md:px-margin-md pb-space-2xl">
<ol class="relative flex flex-col gap-space-lg">
{{changelogEntries}}
</ol>
</section>

<section class="max-w-3xl mx-auto px-margin md:px-margin-md pb-space-2xl">
<div class="rounded-3xl bg-gradient-to-br from-surface-container-high via-surface-container to-surface-container-low p-space-lg md:p-space-xl flex flex-col items-center text-center gap-space-md">
<img src="/apps/synvia-ai/icon-192.webp" width="192" height="192" alt="" loading="lazy" class="w-16 h-16 rounded-2xl shadow-lg">
<h2 class="font-headline-md text-headline-md text-on-surface">{{ctaTitle}}</h2>
<p class="text-on-surface-variant">{{ctaText}}</p>
<div class="w-full max-w-md flex flex-col gap-space-sm">
{{storeButtons}}
</div>
</div>
</section>
</main>

{{partial:synvia-footer}}
<script src="/assets/store.js" defer></script>
<!-- Vercel Web Analytics: çerezsiz ziyaretçi sayacı (aynı alan adından yüklenir, CSP ile uyumlu) -->
<script src="/_vercel/insights/script.js" defer></script>
</body></html>
